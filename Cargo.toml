[package]
name = "nexus"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.29"
egui = "0.29"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
jwalk = "0.8"
rayon = "1"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tar = "0.4"
wl-clipboard-rs = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
